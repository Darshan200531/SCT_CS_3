<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-darker);
        }
        .pwd-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--transition-smooth);
            animation: slideIn 0.6s ease-out forwards;
        }
        @keyframes slideIn {
            from {opacity:0; transform: translateY(20px);}
            to {opacity:1; transform: translateY(0);}
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--cyan);
            text-align: center;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }
        .input-group label {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .input-group input {
            padding: 12px 16px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: rgba(13, 17, 39, 0.8);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            transition: var(--transition-smooth);
        }
        .input-group input:focus {
            outline:none;
            border-color: var(--cyan);
            box-shadow:0 0 10px var(--cyan-glow);
        }
        .strength-meter {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
        }
        .strength-seg {
            flex:1;
            transition: background var(--transition-smooth);
        }
        .strength-text {
            margin-top: 8px;
            font-size: 13px;
            font-weight:600;
            text-align:center;
        }
        .weak {background: var(--ruby);}
        .medium {background:#ffaa00;}
        .strong {background: var(--toxic);}
    </style>
</head>
<body>
    <div class="pwd-card">
        <h1>Password Strength Analyzer</h1>
        <div class="input-group">
            <label for="pwd-input">Enter Password</label>
            <input type="password" id="pwd-input" placeholder="Your secret password" autocomplete="off" />
        </div>
        <div class="strength-meter" id="strength-meter">
            <div class="strength-seg" id="seg1"></div>
            <div class="strength-seg" id="seg2"></div>
            <div class="strength-seg" id="seg3"></div>
        </div>
        <div class="strength-text" id="strength-text">No password entered</div>
    </div>
    <script src="password_tool.js"></script>
</body>
</html>
